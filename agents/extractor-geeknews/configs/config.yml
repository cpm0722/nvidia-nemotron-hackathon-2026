general:
  front_end:
    _type: a2a
    name: "GeekNews Extractor Agent"
    description: "Collects Korean tech-community reactions from GeekNews (news.hada.io) — RSS feed plus HTML enrichment for upvote / comment counts and comment bodies."
    host: 0.0.0.0
    port: 10005

llms:
  primary_llm:
    _type: openai
    model_name: nvidia/nemotron-3-nano
    base_url: https://model-server-4dfr8gv78.brevlab.com/v1
    api_key: empty
    temperature: 0.0
    max_tokens: 4096

function_groups:
  geeknews_scraper:
    _type: geeknews_scraper
    default_limit: 10
    max_text_chars: 8000
    enrich_html: true
    include_comments: true
    max_comments_per_topic: 10
    max_comment_chars: 1500
    html_workers: 4

workflow:
  _type: react_agent
  llm_name: primary_llm
  tool_names:
    - geeknews_scraper__search_posts
  system_prompt: file://../prompts/system_prompt.txt
  verbose: true
  retry_agent_response_parsing_errors: true
  parse_agent_response_max_retries: 3
