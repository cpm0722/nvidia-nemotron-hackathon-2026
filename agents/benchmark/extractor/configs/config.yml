general:
  front_end:
    _type: a2a
    name: "Benchmark Extractor Agent"
    description: "Artificial Analysis와 HuggingFace에서 LLM 벤치마크 점수와 사용자 토론을 수집하는 에이전트"
    host: 0.0.0.0
    port: 10012

llms:
  primary_llm:
    _type: openai
    model_name: nvidia/nemotron-3-nano
    base_url: https://model-server-4dfr8gv78.brevlab.com/v1
    api_key: empty
    temperature: 0.0
    max_tokens: 16384

function_groups:
  benchmark_extractor:
    _type: benchmark_extractor
    discussion_limit: 10
    comment_limit: 3
  validator:
    _type: validator_caller
    url: http://localhost:10022

workflow:
  _type: react_agent
  llm_name: primary_llm
  tool_names:
    - benchmark_extractor__search_benchmarks
    - validator__validate
  system_prompt: file://../prompts/system_prompt.txt
  verbose: true
  retry_agent_response_parsing_errors: true
  parse_agent_response_max_retries: 3
