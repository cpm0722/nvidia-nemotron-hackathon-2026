[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nat_orchestrator"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "NAT A2A orchestration agent: runs the full query-generator → extractors → reporter pipeline"
keywords = ["ai", "agents", "orchestration", "nat", "a2a"]
classifiers = ["Programming Language :: Python"]
dependencies = [
    "nvidia-nat[a2a,langchain]",
    "ari_core",
    "requests>=2.31",
]

[tool.uv.sources]
ari_core = { path = "../../libs/ari-core", editable = true }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.entry-points."nat.components"]
nat_orchestrator = "nat_orchestrator.register"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
