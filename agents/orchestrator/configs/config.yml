general:
  front_end:
    _type: a2a
    name: "Orchestrator Pipeline Agent"
    description: "nemotron-3-super 기반 react_agent. plan_query → collect_evidence(parallel) → write_report tool 을 순서대로 호출해 자연어 질의를 제품별 markdown 보고서로 변환"
    host: 0.0.0.0
    port: 10000

llms:
  primary_llm:
    _type: openai
    model_name: nvidia/nemotron-3-super-120b-a12b
    base_url: ${SUPER_MODEL_BASE_URL:-https://model-server-uya78rbya.brevlab.com/v1}
    api_key: ${SUPER_MODEL_API_KEY:-empty}
    temperature: 0.0
    max_tokens: 8192

functions:
  plan_query:
    _type: plan_query
    query_generator_url: ${QUERY_GENERATOR_URL:-http://localhost:10001}
    timeout_seconds: 180
  collect_evidence:
    _type: collect_evidence
    collector_urls:
      arcalive:  ${ARCALIVE_EXTRACTOR_URL:-http://localhost:10010}
      arxiv:     ${ARXIV_EXTRACTOR_URL:-http://localhost:10011}
      benchmark: ${BENCHMARK_EXTRACTOR_URL:-http://localhost:10012}
      geeknews:  ${GEEKNEWS_EXTRACTOR_URL:-http://localhost:10013}
      lobsters:  ${LOBSTERS_EXTRACTOR_URL:-http://localhost:10014}
      openai:    ${OPENAI_EXTRACTOR_URL:-http://localhost:10015}
      reddit:    ${REDDIT_EXTRACTOR_URL:-http://localhost:10016}
    enabled_collectors: ${ENABLED_COLLECTORS:-arcalive,arxiv,benchmark,geeknews,lobsters,openai,reddit}
    timeout_seconds: 300
  write_report:
    _type: write_report
    reporter_url: ${REPORTER_URL:-http://localhost:10002}
    timeout_seconds: 300

workflow:
  _type: react_agent
  llm_name: primary_llm
  tool_names:
    - plan_query
    - collect_evidence
    - write_report
  system_prompt: file://../prompts/system_prompt.txt
  verbose: true
  max_tool_calls: 30
  use_native_tool_calling: false
