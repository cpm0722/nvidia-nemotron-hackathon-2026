general:
  front_end:
    _type: a2a
    name: "arXiv Extractor Agent"
    description: "Searches arXiv (export.arxiv.org) for research papers matching an AI model or technique keyword."
    host: 0.0.0.0
    port: 10011

llms:
  primary_llm:
    _type: openai
    model_name: nvidia/nemotron-3-nano
    base_url: https://model-server-4dfr8gv78.brevlab.com/v1
    api_key: empty
    temperature: 0.0
    max_tokens: 4096

function_groups:
  arxiv_scraper:
    _type: arxiv_scraper
    default_limit: 10
    max_text_chars: 8000
  validator:
    _type: validator_caller
    url: http://localhost:10021

workflow:
  _type: react_agent
  llm_name: primary_llm
  tool_names:
    - arxiv_scraper__search_papers
    - validator__validate
  system_prompt: file://../prompts/system_prompt.txt
  verbose: true
  retry_agent_response_parsing_errors: true
  parse_agent_response_max_retries: 3
