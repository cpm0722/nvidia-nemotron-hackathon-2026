general:
  front_end:
    _type: a2a
    name: "E2E Pipeline Agent (test)"
    description: "arcalive + geeknews 2개 collector만 사용하는 e2e 테스트용 설정"
    host: 0.0.0.0
    port: 10000

llms:
  primary_llm:
    _type: openai
    model_name: nvidia/nemotron-3-nano
    base_url: https://model-server-4dfr8gv78.brevlab.com/v1
    api_key: empty
    temperature: 0.0
    max_tokens: 4096

function_groups:
  pipeline:
    _type: e2e_pipeline
    query_generator_url: http://localhost:10001
    collector_urls:
      - http://localhost:10010
      - http://localhost:10013
    reporter_url: http://localhost:10002

workflow:
  _type: react_agent
  llm_name: primary_llm
  tool_names:
    - pipeline__generate_queries
    - pipeline__collect_evidence
    - pipeline__generate_report
  system_prompt: file://../prompts/system_prompt.txt
  verbose: true
  retry_agent_response_parsing_errors: true
  parse_agent_response_max_retries: 3
