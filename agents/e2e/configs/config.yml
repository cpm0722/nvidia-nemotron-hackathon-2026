general:
  front_end:
    _type: a2a
    name: "E2E Pipeline Agent"
    description: "사용자 자연어 쿼리를 받아 query-generator → collectors × 7 → reporter 전체 파이프라인을 LLM-less로 실행하는 오케스트레이터"
    host: 0.0.0.0
    port: 10000

workflow:
  _type: e2e_pipeline
  query_generator_url: http://localhost:10001
  collector_urls:
    - http://localhost:10010
    - http://localhost:10011
    - http://localhost:10012
    - http://localhost:10013
    - http://localhost:10014
    - http://localhost:10015
    - http://localhost:10016
  reporter_url: http://localhost:10002
  timeout_seconds: 180
