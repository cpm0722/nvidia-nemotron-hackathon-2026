general:
  front_end:
    _type: a2a
    name: "GeekNews Extractor Agent"
    description: "GeekNews(news.hada.io)에서 한국 테크 게시글을 scrape하고 validator A2A로 필터링하는 LLM-less extractor"
    host: 0.0.0.0
    port: 10013

workflow:
  _type: geeknews_extractor
  limit: 10
  max_text_chars: 8000
  enrich_html: true
  include_comments: true
  max_comments_per_topic: 10
  max_comment_chars: 1500
  html_workers: 4
  validator_url: ${VALIDATOR_URL:-http://localhost:10023}
  validator_timeout_seconds: 180
