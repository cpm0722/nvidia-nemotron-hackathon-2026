[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nat_benchmark_validator"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "NAT A2A validator agent for benchmark extractor"
keywords = ["ai", "agents", "validator", "benchmark", "nat", "a2a"]
classifiers = ["Programming Language :: Python"]
dependencies = [
    "nvidia-nat[a2a,langchain]",
    "validator_core",
]

[tool.uv.sources]
validator_core = { workspace = true }

[project.entry-points."nat.components"]
nat_benchmark_validator = "nat_benchmark_validator.register"
