[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nat_collector_benchmark"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "NAT A2A benchmark collector — LLM-less scrape + keyword-filter service"
keywords = ["ai", "agents", "scraper", "benchmark", "nat", "a2a", "collector"]
classifiers = ["Programming Language :: Python"]
dependencies = [
    "nvidia-nat[a2a]",
    "ari_core",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.uv.sources]
ari_core = { path = "../../../libs/ari-core", editable = true }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.entry-points."nat.components"]
nat_collector_benchmark = "nat_collector_benchmark.register"
