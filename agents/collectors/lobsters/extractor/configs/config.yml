general:
  front_end:
    _type: a2a
    name: "Lobsters Extractor Agent"
    description: "Lobsters(lobste.rs)에서 토론을 scrape하고 validator A2A로 필터링하는 LLM-less extractor"
    host: 0.0.0.0
    port: 10014

workflow:
  _type: lobsters_extractor
  limit: 10
  max_text_chars: 8000
  enrich_json: true
  include_comments: true
  max_comments_per_story: 10
  max_comment_chars: 1500
  workers: 4
  validator_url: ${VALIDATOR_URL:-http://localhost:10024}
  validator_timeout_seconds: 180
