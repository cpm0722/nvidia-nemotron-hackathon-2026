[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nat_collector_arcalive"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "NAT A2A agent that scrapes arca.live and filters by keyword relevance (LLM-less collector)"
keywords = ["ai", "agents", "scraper", "arcalive", "nat", "a2a", "collector"]
classifiers = ["Programming Language :: Python"]
dependencies = [
    "nvidia-nat[a2a]",
    "ari_core",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.uv.sources]
ari_core = { path = "../../../libs/ari-core", editable = true }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.entry-points."nat.components"]
nat_collector_arcalive = "nat_collector_arcalive.register"
