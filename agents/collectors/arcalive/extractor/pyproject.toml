[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "nat_extractor_arcalive"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "NAT A2A arcalive extractor — scrape arca.live then forward to validator A2A"
keywords = ["ai", "agents", "scraper", "arcalive", "nat", "a2a", "extractor"]
classifiers = ["Programming Language :: Python"]
dependencies = [
    "nvidia-nat[a2a]",
    "ari_core",
    "validator_core",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.uv.sources]
ari_core = { path = "../../../../libs/ari-core", editable = true }
validator_core = { path = "../../../../libs/validator-core", editable = true }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.entry-points."nat.components"]
nat_extractor_arcalive = "nat_extractor_arcalive.register"
