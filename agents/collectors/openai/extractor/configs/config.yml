general:
  front_end:
    _type: a2a
    name: "OpenAI Blog Extractor Agent"
    description: "OpenAI 공식 블로그(openai.com/news)에서 포스트를 scrape하고 validator A2A로 필터링하는 LLM-less extractor"
    host: 0.0.0.0
    port: 10015

workflow:
  _type: openai_extractor
  limit: 10
  max_text_chars: 8000
  validator_url: ${VALIDATOR_URL:-http://localhost:10025}
  validator_timeout_seconds: 120
