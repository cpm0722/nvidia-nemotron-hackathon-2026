general:
  front_end:
    _type: a2a
    name: "Arcalive Extractor Agent"
    description: "아카라이브(arca.live)에서 AI 프러덕트에 대한 한국 사용자 반응을 수집하는 에이전트"
    host: 0.0.0.0
    port: 10000

llms:
  primary_llm:
    _type: openai
    model_name: nvidia/nemotron-3-nano
    base_url: https://model-server-uya78rbya.brevlab.com/v1
    api_key: empty
    temperature: 0.0
    max_tokens: 4096

function_groups:
  arcalive_scraper:
    _type: arcalive_scraper
    board: alpaca
    max_pages: 2

workflow:
  _type: react_agent
  llm_name: primary_llm
  tool_names:
    - arcalive_scraper__search_posts
  system_prompt: file://../prompts/system_prompt.txt
  verbose: true
  retry_agent_response_parsing_errors: true
  parse_agent_response_max_retries: 3
