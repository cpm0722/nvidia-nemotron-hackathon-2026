general:
  front_end:
    _type: a2a
    name: "Lobsters Extractor Agent"
    description: "Collects tech discussion posts from Lobsters (lobste.rs) via RSS + per-story JSON API (body + comments)."
    host: 0.0.0.0
    port: 10004

llms:
  primary_llm:
    _type: openai
    model_name: nvidia/nemotron-3-nano
    base_url: https://model-server-4dfr8gv78.brevlab.com/v1
    api_key: empty
    temperature: 0.0
    max_tokens: 4096

function_groups:
  lobsters_scraper:
    _type: lobsters_scraper
    default_limit: 10
    max_text_chars: 8000
    enrich_json: true
    include_comments: true
    max_comments_per_story: 10
    max_comment_chars: 1500
  validator:
    _type: validator_caller
    url: http://localhost:10010
    system_prompt_file: prompts/validator_system_prompt.txt

workflow:
  _type: react_agent
  llm_name: primary_llm
  tool_names:
    - lobsters_scraper__search_posts
    - validator__validate
  system_prompt: file://../prompts/system_prompt.txt
  verbose: true
  retry_agent_response_parsing_errors: true
  parse_agent_response_max_retries: 3
